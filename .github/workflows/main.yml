name: Build Kernel

on:
  push:
    branches:
      - bandido
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
        git bc bison build-essential curl flex gcc-aarch64-linux-gnu \
        gcc-arm-linux-gnueabi libssl-dev libncurses5-dev lzop \
        python3 unzip zip clang llvm

    - name: Setup clang
      run: |
        git clone https://github.com/llvm/llvm-project.git --depth=1 clang

    - name: Build kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$PWD/clang/bin:$PATH

        make O=out ARCH=arm64 r8q_eur_open_defconfig

        make -j$(nproc) \
        O=out \
        ARCH=arm64 \
        CC=clang \
        CROSS_COMPILE=aarch64-linux-gnu-

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: out/arch/arm64/boot/Image
