name: Build Kernel

on:
  push:
    branches:
      - bandido
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
        bc bison build-essential ccache curl flex git \
        gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
        libssl-dev libncurses5-dev libncurses-dev \
        lzop python3 unzip zip wget

    - name: Download Android Clang (Proton-Clang mirror)
      run: |
        git clone --depth=1 -b main https://github.com/kdrag0n/proton-clang.git clang
        # Or use a specific release if needed:
        # wget -O clang.tar.xz https://github.com/kdrag0n/proton-clang/releases/download/r487747c/clang-r487747c.tar.xz
        # tar -xf clang.tar.xz -C clang --strip-components=1

    - name: Build kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$PWD/clang/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-

        make O=out ARCH=arm64 r8q_eur_open_defconfig
        make -j$(nproc) O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=$CLANG_TRIPLE \
          CROSS_COMPILE=$CROSS_COMPILE \
          CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: out/arch/arm64/boot/Image

    - name: Upload AnyKernel3 package (optional)
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3-flashable
        path: AnyKernel3/
